/**:
  ros__parameters:
    # Path to the OSM/Lanelet2 map file
    map_file_path: ""

    # Input pose message type
    # Valid types: PoseWithCovarianceStamped, PoseStamped, PoseWithCovariance, Pose
    input_pose_type: "PoseWithCovarianceStamped"

    # Search radius for finding nearest lanelet (meters)
    search_radius: 5.0

    # Publish rate limit (Hz) - 0 means publish on every pose update
    publish_rate: 10.0

    # Frame ID for the output message (used when input has no header)
    frame_id: "map"
